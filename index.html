<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen 2.5 Thinking Chatbot</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #8b5cf6; 
            --accent-hover: #7c3aed;
            --user-bubble: #2563eb;
            --ai-bubble: #334155;
            --danger: #ef4444;
            --think-bg: rgba(139, 92, 246, 0.1);
            --think-border: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            height: 95vh;
            background: var(--bg-secondary);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--bg-tertiary);
        }

        header {
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--bg-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-size: 1.25rem; font-weight: 600; }
        .header-sub { font-size: 0.75rem; color: var(--text-secondary); }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--danger);
            transition: background 0.3s;
        }
        .status-badge.ready { background: #10b981; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 90%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .user .avatar { background: var(--user-bubble); }
        .ai .avatar { background: var(--bg-tertiary); color: var(--accent); }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
        .ai .bubble { background: var(--ai-bubble); border-bottom-left-radius: 4px; }

        .thinking-block {
            background: var(--think-bg);
            border-left: 3px solid var(--think-border);
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            line-height: 1.5;
        }
        
        .thinking-label {
            font-weight: bold;
            color: var(--accent);
            font-style: normal;
            display: block;
            margin-bottom: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            padding: 16px 24px;
            background: var(--bg-primary);
            border-top: 1px solid var(--bg-tertiary);
        }

        #progress-container { margin-bottom: 12px; display: none; }
        #progress-container.active { display: block; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .input-group { display: flex; gap: 12px; }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #user-input:focus { border-color: var(--accent); }
        #user-input:disabled { opacity: 0.5; cursor: not-allowed; }

        button {
            padding: 12px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:active:not(:disabled) { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .clear-btn {
            background: transparent;
            border: 1px solid var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
        }
        .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div>
            <div class="header-title">Qwen 2.5 1.5B (Thinking Mode)</div>
            <div class="header-sub">Runs 100% locally in your browser via WebGPU</div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="clear-btn" id="clear-btn" disabled>Clear Chat</button>
            <span class="status-badge" id="status-badge">Initializing...</span>
        </div>
    </header>

    <main id="chat-container"></main>

    <footer>
        <div id="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">Loading model weights... 0%</div>
        </div>
        <form id="chat-form" class="input-group">
            <input type="text" id="user-input" placeholder="Model is loading..." disabled autocomplete="off">
            <button type="submit" id="send-btn" disabled>Send</button>
        </form>
    </footer>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const statusBadge = document.getElementById('status-badge');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');

    let engine;
    let isGenerating = false;
    let chatHistory = [];

    async function init() {
        if (!navigator.gpu) {
            statusBadge.textContent = "WebGPU Not Supported";
            statusBadge.style.background = "var(--danger)";
            addMessage('ai', "Error: Your browser does not support WebGPU. Please use Chrome or Edge on a modern device.");
            return;
        }

        engine = new webllm.MLCEngine();
        
        engine.setInitProgressCallback((report) => {
            progressContainer.classList.add('active');
            progressFill.style.width = `${(report.progress * 100).toFixed(1)}%`;
            progressText.textContent = report.text || `Loading model... ${(report.progress * 100).toFixed(1)}%`;
        });

        try {
            // FIXED: Using Qwen2.5-1.5B-Instruct which is guaranteed to be in the WebLLM registry
            await engine.reload("Qwen2.5-1.5B-Instruct-q4f16_1-MLC");
            
            progressContainer.classList.remove('active');
            statusBadge.textContent = "Ready";
            statusBadge.classList.add('ready');
            userInput.disabled = false;
            sendBtn.disabled = false;
            clearBtn.disabled = false;
            userInput.placeholder = "Ask a complex question...";
            userInput.focus();
            
            addMessage('ai', "Hello! I am Qwen 2.5 1.5B running in 'Thinking Mode'. I will analyze your question step-by-step before answering.");
        } catch (err) {
            statusBadge.textContent = "Load Failed";
            statusBadge.style.background = "var(--danger)";
            addMessage('ai', `Failed to load model: ${err.message}`);
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isGenerating) return;

        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = '';
        isGenerating = true;
        sendBtn.disabled = true;
        sendBtn.textContent = "...";

        addMessage('user', text);
        chatHistory.push({ role: "user", content: text });

        const aiBubble = addMessage('ai', '');

        try {
            // SYSTEM PROMPT: Forces the standard Qwen model to act like a "Thinking" model
            const messages = [
                { 
                    role: "system", 
                    content: "You are an expert AI assistant with deep reasoning capabilities. For every response, you MUST first show your step-by-step thinking process enclosed in <think> and </think> tags. After your reasoning is complete, provide your final, clear answer." 
                },
                ...chatHistory
            ];

            const stream = await engine.chat.completions.create({
                messages: messages,
                stream: true,
                temperature: 0.6, 
            });

            let fullText = "";
            for await (const chunk of stream) {
                const delta = chunk.choices[0].delta.content || "";
                fullText += delta;
                
                aiBubble.innerHTML = formatThinkingText(fullText);
                scrollToBottom();
            }

            aiBubble.innerHTML = formatThinkingText(fullText);
            chatHistory.push({ role: "assistant", content: fullText });

        } catch (err) {
            aiBubble.textContent = `Error: ${err.message}`;
        }

        isGenerating = false;
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        userInput.focus();
    });

    clearBtn.addEventListener('click', () => {
        chatContainer.innerHTML = '';
        chatHistory = [];
        addMessage('ai', "Chat cleared. Memory freed. What's next?");
    });

    function formatThinkingText(text) {
        let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        safeText = safeText.replace(
            /&lt;think&gt;(.*?)&lt;\/think&gt;/gs, 
            '<div class="thinking-block"><span class="thinking-label">💭 Thinking Process</span>$1</div>'
        );
        
        return safeText;
    }

    function addMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = text;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatContainer.appendChild(msgDiv);
        scrollToBottom();
        
        return bubble;
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    init();
</script>

</body>
</html>
