<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Studio & Realtime Web Access</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              50: '#f0f4f9',
              100: '#e1e9f5',
              200: '#c3d3ec',
              500: '#1a73e8',
              600: '#1557b0',
              800: '#1e1f20',
              900: '#131314',
              950: '#0e0e0e'
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked parser for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .gradient-text {
      background: linear-gradient(135deg, #4285f4 0%, #9b51e0 50%, #e91e63 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.5);
    }
    /* Markdown Styling */
    .prose code {
      background-color: rgba(0, 0, 0, 0.2);
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
    }
    .prose pre {
      background-color: #1e1f20 !important;
      padding: 1rem;
      border-radius: 0.75rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    .prose p {
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }
    .prose ul, .prose ol {
      margin-left: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .prose ul { list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
  </style>
</head>
<body class="bg-gemini-900 text-gray-100 min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

  <div id="root" class="flex-1 flex flex-col h-screen overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_AGENTS = [
      {
        id: 'realtime-web',
        name: 'Gemini Web Search Agent',
        description: 'Grounds responses with real-time web search results & live facts.',
        systemPrompt: 'You are Gemini with Realtime Web Access. Provide helpful, accurate, and up-to-date information.',
        useSearch: true,
        icon: 'globe'
      },
      {
        id: 'coding-wizard',
        name: 'Senior Code Architect',
        description: 'Specialized in clean, robust code generation, debugging, and system design.',
        systemPrompt: 'You are a Senior Principal Software Architect. Always write self-contained, well-commented, modular code with explanations.',
        useSearch: false,
        icon: 'code'
      },
      {
        id: 'creative-writer',
        name: 'Creative Content Director',
        description: 'Crafts compelling articles, scripts, stories, and engaging content.',
        systemPrompt: 'You are an award-winning creative writer and copy strategist. Craft vivid, articulate, and highly engaging prose.',
        useSearch: false,
        icon: 'feather'
      },
      {
        id: 'custom-agent',
        name: 'Custom AI Agent',
        description: 'User-customized AI persona with custom instructions.',
        systemPrompt: 'You are a versatile, highly intelligent AI assistant.',
        useSearch: true,
        icon: 'bot'
      }
    ];

    // Helper to convert base64 PCM audio into WAV Blob for playback
    function pcmToWav(pcmData, sampleRate = 24000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = (sampleRate * numChannels * bitsPerSample) / 8;
      const blockAlign = (numChannels * bitsPerSample) / 8;
      const dataSize = pcmData.length * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < pcmData.length; i++, offset += 2) {
        view.setInt16(offset, pcmData[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Main App Component
    function App() {
      // Configuration & API States
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [customSystemPrompt, setCustomSystemPrompt] = useState(() => localStorage.getItem('gemini_custom_prompt') || '');
      const [agents, setAgents] = useState(DEFAULT_AGENTS);
      const [activeAgentId, setActiveAgentId] = useState('realtime-web');
      const [webSearchEnabled, setWebSearchEnabled] = useState(true);
      const [mode, setMode] = useState('chat'); // 'chat' | 'image'
      
      // UI States
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [ghPagesModalOpen, setGhPagesModalOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [attachedImage, setAttachedImage] = useState(null); // { base64, mimeType }
      const [isRecording, setIsRecording] = useState(false);
      const [playingAudioId, setPlayingAudioId] = useState(null);
      
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const recognitionRef = useRef(null);

      const activeAgent = agents.find(a => a.id === activeAgentId) || agents[0];

      // Auto-scroll to bottom of chat
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isLoading]);

      // Initialize Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Save user API key
      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('gemini_api_key', key);
      };

      // Image upload handler
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        if (!file.type.startsWith('image/')) {
          alert("Please upload a valid image file.");
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          const base64String = event.target.result.split(',')[1];
          setAttachedImage({
            base64: base64String,
            mimeType: file.type,
            previewUrl: event.target.result
          });
        };
        reader.readAsDataURL(file);
      };

      // Voice dictation toggle
      const toggleVoiceDictation = () => {
        if (isRecording) {
          recognitionRef.current?.stop();
          setIsRecording(false);
        } else {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            alert("Speech recognition is not supported in this browser.");
            return;
          }
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = true;
          
          recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
              .map(result => result[0].transcript)
              .join('');
            setInputMessage(transcript);
          };

          recognition.onend = () => {
            setIsRecording(false);
          };

          recognition.onerror = () => {
            setIsRecording(false);
          };

          recognition.start();
          recognitionRef.current = recognition;
          setIsRecording(true);
        }
      };

      // Execute Speech Generation via Gemini TTS
      const speakText = async (messageId, text) => {
        if (playingAudioId === messageId) {
          setPlayingAudioId(null);
          return;
        }

        try {
          setPlayingAudioId(messageId);
          // Strip markdown for speech synthesis
          const cleanText = text.replace(/```[\s\S]*?```/g, 'Code block snippet omitted.').replace(/[#*_-]/g, '');
          
          const keyToUse = apiKey || '';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${keyToUse}`;
          
          const payload = {
            contents: [{ parts: [{ text: `Say clearly: ${cleanText.slice(0, 500)}` }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: { prebuiltVoiceConfig: { voiceName: "Zephyr" } }
              }
            }
          };

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          const part = data?.candidates?.[0]?.content?.parts?.[0];
          
          if (part && part.inlineData && part.inlineData.data) {
            const mimeType = part.inlineData.mimeType || 'audio/L16;rate=24000';
            const sampleRateMatch = mimeType.match(/rate=(\d+)/);
            const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
            
            const pcmBuffer = base64ToArrayBuffer(part.inlineData.data);
            const pcm16 = new Int16Array(pcmBuffer);
            const wavBlob = pcmToWav(pcm16, sampleRate);
            const audioUrl = URL.createObjectURL(wavBlob);
            
            const audio = new Audio(audioUrl);
            audio.onended = () => setPlayingAudioId(null);
            audio.play();
          } else {
            // Fallback to Web Speech API if TTS API returns no inline audio
            const utterance = new SpeechSynthesisUtterance(cleanText.slice(0, 300));
            utterance.onend = () => setPlayingAudioId(null);
            window.speechSynthesis.speak(utterance);
          }
        } catch (err) {
          console.error("TTS error:", err);
          setPlayingAudioId(null);
        }
      };

      // Submit prompt to Gemini API
      const handleSendMessage = async (customPrompt = null) => {
        const textPrompt = customPrompt || inputMessage;
        if ((!textPrompt.trim() && !attachedImage) || isLoading) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text: textPrompt,
          image: attachedImage ? attachedImage.previewUrl : null,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setInputMessage('');
        setIsLoading(true);

        const currentImage = attachedImage;
        setAttachedImage(null);

        try {
          if (mode === 'image') {
            // Handle Image Generation using Imagen 4 model
            const keyToUse = apiKey || '';
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${keyToUse}`;
            
            const payload = {
              instances: [{ prompt: textPrompt }],
              parameters: { sampleCount: 1 }
            };

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (result.predictions && result.predictions[0]?.bytesBase64Encoded) {
              const generatedImageUrl = `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
              setMessages(prev => [
                ...prev,
                {
                  id: Date.now() + 1,
                  sender: 'ai',
                  text: `Here is the image generated for: "${textPrompt}"`,
                  generatedImage: generatedImageUrl,
                  timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
              ]);
            } else {
              throw new Error("Could not generate image. Check key or request limits.");
            }
          } else {
            // Handle Chat & Realtime Search Grounding
            const keyToUse = apiKey || '';
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${keyToUse}`;

            // Build request parts
            const parts = [];
            if (currentImage) {
              parts.push({
                inlineData: {
                  mimeType: currentImage.mimeType,
                  data: currentImage.base64
                }
              });
            }
            parts.push({ text: textPrompt });

            // Combine previous messages into Gemini API conversation history format
            const contentsHistory = messages.map(msg => ({
              role: msg.sender === 'user' ? 'user' : 'model',
              parts: [{ text: msg.text || '' }]
            }));

            contentsHistory.push({ role: 'user', parts });

            // Build System Instruction
            let sysInstructionText = activeAgent.systemPrompt;
            if (activeAgent.id === 'custom-agent' && customSystemPrompt) {
              sysInstructionText = customSystemPrompt;
            }

            const payload = {
              contents: contentsHistory,
              systemInstruction: { parts: [{ text: sysInstructionText }] }
            };

            // Enable Realtime Web Access Search Grounding if toggled
            if (webSearchEnabled || activeAgent.useSearch) {
              payload.tools = [{ "google_search": {} }];
            }

            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const result = await response.json();
            const candidate = result.candidates?.[0];

            if (candidate && candidate.content?.parts?.[0]?.text) {
              const replyText = candidate.content.parts[0].text;
              
              // Extract Search Grounding metadata & citations if present
              let sources = [];
              const groundingMetadata = candidate.groundingMetadata;
              if (groundingMetadata && groundingMetadata.groundingAttributions) {
                sources = groundingMetadata.groundingAttributions
                  .map(attr => ({
                    uri: attr.web?.uri,
                    title: attr.web?.title || attr.web?.uri
                  }))
                  .filter(src => src.uri);
              }

              setMessages(prev => [
                ...prev,
                {
                  id: Date.now() + 1,
                  sender: 'ai',
                  text: replyText,
                  sources: sources,
                  timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
              ]);
            } else {
              throw new Error(result.error?.message || "No response text received from Gemini API.");
            }
          }
        } catch (err) {
          console.error("Gemini Request Error:", err);
          setMessages(prev => [
            ...prev,
            {
              id: Date.now() + 1,
              sender: 'ai',
              text: `⚠️ **API Error:** ${err.message || 'Failed to reach Gemini API. Ensure connection or custom key configuration.'}`,
              isError: true,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      // Copy text to clipboard helper
      const copyToClipboard = (text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
      };

      return (
        <div className="flex h-full overflow-hidden bg-gemini-900">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className={`${sidebarOpen ? 'w-72' : 'w-0 sm:w-16'} transition-all duration-300 ease-in-out bg-gemini-950 border-r border-gray-800 flex flex-col z-20 overflow-hidden`}>
            
            {/* Sidebar Header */}
            <div className="p-4 flex items-center justify-between border-b border-gray-800/80">
              <div className="flex items-center space-x-3">
                <button 
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                  className="p-2 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition"
                  title="Toggle Sidebar"
                >
                  <i data-lucide="menu" className="w-5 h-5"></i>
                </button>
                {sidebarOpen && (
                  <div className="flex items-center space-x-2">
                    <span className="font-bold text-lg tracking-tight gradient-text">Gemini Web</span>
                    <span className="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-semibold border border-blue-500/30">Live</span>
                  </div>
                )}
              </div>
            </div>

            {/* New Chat Button */}
            <div className="p-3">
              <button 
                onClick={() => setMessages([])}
                className={`w-full flex items-center ${sidebarOpen ? 'justify-start space-x-3 px-4' : 'justify-center'} py-3 bg-gemini-800 hover:bg-gray-700/80 text-gray-200 rounded-xl transition font-medium border border-gray-700/50 shadow-sm`}
              >
                <i data-lucide="plus" className="w-5 h-5 text-blue-400"></i>
                {sidebarOpen && <span>New Conversation</span>}
              </button>
            </div>

            {/* Agent / Persona Selection */}
            {sidebarOpen && (
              <div className="px-3 py-2 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                <div>
                  <h3 className="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">AI Agent Mode</h3>
                  <div className="space-y-1">
                    {agents.map(agent => (
                      <button
                        key={agent.id}
                        onClick={() => setActiveAgentId(agent.id)}
                        className={`w-full text-left p-2.5 rounded-xl transition flex items-start space-x-3 ${activeAgentId === agent.id ? 'bg-blue-600/20 text-blue-300 border border-blue-500/40' : 'hover:bg-gemini-800/60 text-gray-300'}`}
                      >
                        <div className={`p-2 rounded-lg ${activeAgentId === agent.id ? 'bg-blue-500 text-white' : 'bg-gray-800 text-gray-400'}`}>
                          <i data-lucide={agent.icon || 'bot'} className="w-4 h-4"></i>
                        </div>
                        <div className="flex-1 min-w-0">
                          <p className="text-sm font-medium truncate">{agent.name}</p>
                          <p className="text-xs text-gray-400 truncate">{agent.description}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Custom System Prompt Area */}
                {activeAgentId === 'custom-agent' && (
                  <div className="p-3 bg-gemini-800/40 rounded-xl border border-gray-800">
                    <label className="text-xs font-semibold text-gray-300 block mb-1">Custom System Instruction</label>
                    <textarea
                      value={customSystemPrompt}
                      onChange={(e) => {
                        setCustomSystemPrompt(e.target.value);
                        localStorage.setItem('gemini_custom_prompt', e.target.value);
                      }}
                      placeholder="e.g. Act as a world-class financial analyst and provide concise executive summaries..."
                      className="w-full text-xs p-2 rounded-lg bg-gemini-900 border border-gray-700 text-gray-200 focus:outline-none focus:border-blue-500 custom-scrollbar h-20 resize-none"
                    />
                  </div>
                )}
              </div>
            )}

            {/* Sidebar Footer Controls */}
            <div className="p-3 border-t border-gray-800 space-y-1">
              <button 
                onClick={() => setGhPagesModalOpen(true)}
                className={`w-full flex items-center ${sidebarOpen ? 'justify-start space-x-3 px-3' : 'justify-center'} py-2.5 rounded-lg text-xs font-medium text-purple-400 hover:bg-purple-900/20 border border-purple-500/30 transition`}
              >
                <i data-lucide="github" className="w-4 h-4"></i>
                {sidebarOpen && <span>Deploy on GitHub Pages</span>}
              </button>

              <button 
                onClick={() => setSettingsOpen(true)}
                className={`w-full flex items-center ${sidebarOpen ? 'justify-start space-x-3 px-3' : 'justify-center'} py-2.5 rounded-lg text-sm text-gray-400 hover:bg-gemini-800 hover:text-gray-200 transition`}
              >
                <i data-lucide="settings" className="w-4 h-4"></i>
                {sidebarOpen && <span>API & Customization</span>}
              </button>
            </div>
          </aside>

          {/* MAIN CHAT AREA */}
          <main className="flex-1 flex flex-col h-full overflow-hidden bg-gemini-900 relative">
            
            {/* Top Bar Header */}
            <header className="h-16 border-b border-gray-800/80 px-4 sm:px-6 flex items-center justify-between bg-gemini-900/80 backdrop-blur-md z-10">
              <div className="flex items-center space-x-3">
                {!sidebarOpen && (
                  <button 
                    onClick={() => setSidebarOpen(true)}
                    className="p-2 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-white transition"
                  >
                    <i data-lucide="menu" className="w-5 h-5"></i>
                  </button>
                )}

                {/* Model / Mode Selector Pills */}
                <div className="flex items-center bg-gemini-950 p-1 rounded-xl border border-gray-800">
                  <button 
                    onClick={() => setMode('chat')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 ${mode === 'chat' ? 'bg-blue-600 text-white shadow-sm' : 'text-gray-400 hover:text-white'}`}
                  >
                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                    <span>Gemini 3 Flash</span>
                  </button>
                  <button 
                    onClick={() => setMode('image')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 ${mode === 'image' ? 'bg-purple-600 text-white shadow-sm' : 'text-gray-400 hover:text-white'}`}
                  >
                    <i data-lucide="image" className="w-3.5 h-3.5"></i>
                    <span>Imagen 4 Generator</span>
                  </button>
                </div>
              </div>

              {/* Status Indicator & Controls */}
              <div className="flex items-center space-x-3">
                {/* Search Grounding Toggle Pill */}
                <button
                  onClick={() => setWebSearchEnabled(!webSearchEnabled)}
                  className={`flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border transition ${
                    webSearchEnabled 
                      ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' 
                      : 'bg-gray-800/60 text-gray-400 border-gray-700'
                  }`}
                  title="Toggle Google Search Real-time Grounding"
                >
                  <i data-lucide="globe" className="w-3.5 h-3.5"></i>
                  <span className="hidden sm:inline">{webSearchEnabled ? 'Realtime Web Active' : 'Web Access Off'}</span>
                </button>

                <button
                  onClick={() => setSettingsOpen(true)}
                  className="p-2 text-gray-400 hover:text-white hover:bg-gemini-800 rounded-lg transition"
                  title="API Settings"
                >
                  <i data-lucide="sliders" className="w-4 h-4"></i>
                </button>
              </div>
            </header>

            {/* CHAT MESSAGES DISPLAY */}
            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 space-y-6 max-w-4xl w-full mx-auto">
              
              {/* Welcome Banner when empty */}
              {messages.length === 0 && (
                <div className="my-12 text-center space-y-6 max-w-2xl mx-auto">
                  <div className="inline-flex p-4 rounded-3xl bg-gradient-to-tr from-blue-600/20 via-purple-600/20 to-pink-600/20 border border-blue-500/20">
                    <i data-lucide="sparkles" className="w-10 h-10 text-blue-400"></i>
                  </div>
                  <div>
                    <h1 className="text-3xl sm:text-4xl font-extrabold gradient-text tracking-tight mb-2">
                      Hello, Human.
                    </h1>
                    <p className="text-gray-400 text-sm sm:text-base">
                      How can I help you today? Ask questions with live web search, draft code, or create images.
                    </p>
                  </div>

                  {/* Suggestion Chips */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left pt-4">
                    <button 
                      onClick={() => handleSendMessage("Search the latest tech trends and breaking global news today.")}
                      className="p-3.5 bg-gemini-800/50 hover:bg-gemini-800 rounded-2xl border border-gray-800 text-gray-300 text-xs sm:text-sm transition text-left flex items-start space-x-3 group"
                    >
                      <i data-lucide="globe" className="w-4 h-4 text-emerald-400 mt-0.5 group-hover:scale-110 transition"></i>
                      <span>"Search live tech trends & news today"</span>
                    </button>

                    <button 
                      onClick={() => handleSendMessage("Write a high-performance Python search function using async/await and robust error handling.")}
                      className="p-3.5 bg-gemini-800/50 hover:bg-gemini-800 rounded-2xl border border-gray-800 text-gray-300 text-xs sm:text-sm transition text-left flex items-start space-x-3 group"
                    >
                      <i data-lucide="code" className="w-4 h-4 text-blue-400 mt-0.5 group-hover:scale-110 transition"></i>
                      <span>"Write a high-performance Python search function"</span>
                    </button>

                    <button 
                      onClick={() => {
                        setMode('image');
                        handleSendMessage("A futuristic glass cybernetic skyscraper at sunset, photorealistic 8k render");
                      }}
                      className="p-3.5 bg-gemini-800/50 hover:bg-gemini-800 rounded-2xl border border-gray-800 text-gray-300 text-xs sm:text-sm transition text-left flex items-start space-x-3 group"
                    >
                      <i data-lucide="image" className="w-4 h-4 text-purple-400 mt-0.5 group-hover:scale-110 transition"></i>
                      <span>"Generate a futuristic glass skyscraper at sunset"</span>
                    </button>

                    <button 
                      onClick={() => handleSendMessage("Explain quantum computing concepts simply using a friendly analogy.")}
                      className="p-3.5 bg-gemini-800/50 hover:bg-gemini-800 rounded-2xl border border-gray-800 text-gray-300 text-xs sm:text-sm transition text-left flex items-start space-x-3 group"
                    >
                      <i data-lucide="brain-circuit" className="w-4 h-4 text-pink-400 mt-0.5 group-hover:scale-110 transition"></i>
                      <span>"Explain quantum computing simply"</span>
                    </button>
                  </div>
                </div>
              )}

              {/* Message List */}
              {messages.map((msg) => (
                <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'} group`}>
                  <div className={`max-w-3xl w-full rounded-2xl p-4 sm:p-5 ${
                    msg.sender === 'user' 
                      ? 'bg-blue-600 text-white rounded-tr-none ml-auto max-w-xl' 
                      : 'bg-gemini-800/80 border border-gray-700/60 text-gray-100 rounded-tl-none shadow-md'
                  }`}>
                    
                    {/* Message Header */}
                    <div className="flex items-center justify-between mb-2 pb-1 border-b border-white/10 text-xs">
                      <div className="flex items-center space-x-2 font-medium">
                        {msg.sender === 'user' ? (
                          <>
                            <i data-lucide="user" className="w-3.5 h-3.5"></i>
                            <span>You</span>
                          </>
                        ) : (
                          <>
                            <i data-lucide="sparkles" className="w-3.5 h-3.5 text-blue-400"></i>
                            <span className="gradient-text font-bold">Gemini AI</span>
                          </>
                        )}
                      </div>
                      <span className="opacity-60 text-[10px]">{msg.timestamp}</span>
                    </div>

                    {/* Attached Image Preview if uploaded by user */}
                    {msg.image && (
                      <div className="mb-3">
                        <img src={msg.image} alt="User Upload" className="max-h-60 rounded-xl object-contain border border-white/20" />
                      </div>
                    )}

                    {/* AI Generated Image Output */}
                    {msg.generatedImage && (
                      <div className="my-3">
                        <img src={msg.generatedImage} alt="Generated AI Visual" className="max-h-96 w-full object-cover rounded-xl border border-gray-700 shadow-lg" />
                      </div>
                    )}

                    {/* Formatted Markdown Content */}
                    <div 
                      className="prose prose-invert max-w-none text-sm leading-relaxed"
                      dangerouslySetInnerHTML={{ 
                        __html: window.marked ? window.marked.parse(msg.text) : msg.text 
                      }}
                    />

                    {/* Realtime Search Grounding Sources Chips */}
                    {msg.sources && msg.sources.length > 0 && (
                      <div className="mt-4 pt-3 border-t border-gray-700/60">
                        <p className="text-xs font-semibold text-emerald-400 flex items-center space-x-1 mb-2">
                          <i data-lucide="globe" className="w-3.5 h-3.5"></i>
                          <span>Realtime Sources Grounded:</span>
                        </p>
                        <div className="flex flex-wrap gap-1.5">
                          {msg.sources.map((src, i) => (
                            <a
                              key={i}
                              href={src.uri}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex items-center space-x-1 text-[11px] bg-gemini-900/90 hover:bg-gray-900 text-blue-300 border border-gray-700 px-2.5 py-1 rounded-full transition truncate max-w-xs"
                            >
                              <i data-lucide="external-link" className="w-3 h-3 text-gray-400"></i>
                              <span className="truncate">{src.title}</span>
                            </a>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* AI Message Action Controls (Copy, Read Aloud) */}
                    {msg.sender === 'ai' && (
                      <div className="mt-3 pt-2 flex items-center space-x-2 text-gray-400 opacity-90 group-hover:opacity-100 transition">
                        <button
                          onClick={() => copyToClipboard(msg.text)}
                          className="p-1.5 hover:bg-gray-700 rounded-lg text-xs flex items-center space-x-1 transition"
                          title="Copy response"
                        >
                          <i data-lucide="copy" className="w-3.5 h-3.5"></i>
                          <span className="text-[10px]">Copy</span>
                        </button>

                        <button
                          onClick={() => speakText(msg.id, msg.text)}
                          className={`p-1.5 hover:bg-gray-700 rounded-lg text-xs flex items-center space-x-1 transition ${playingAudioId === msg.id ? 'text-blue-400 bg-blue-500/10' : ''}`}
                          title="Read aloud using Gemini Voice"
                        >
                          <i data-lucide={playingAudioId === msg.id ? "volume-x" : "volume-2"} className="w-3.5 h-3.5"></i>
                          <span className="text-[10px]">{playingAudioId === msg.id ? 'Stop' : 'Listen'}</span>
                        </button>
                      </div>
                    )}

                  </div>
                </div>
              ))}

              {/* Loading Indicator */}
              {isLoading && (
                <div className="flex justify-start">
                  <div className="bg-gemini-800/80 border border-gray-700/60 rounded-2xl rounded-tl-none p-4 flex items-center space-x-3">
                    <div className="w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
                    <span className="text-xs text-gray-300 font-medium animate-pulse">
                      Gemini is searching & thinking...
                    </span>
                  </div>
                </div>
              )}

              <div ref={messagesEndRef} />
            </div>

            {/* INPUT CONTROLS BAR */}
            <div className="p-4 bg-gemini-900 border-t border-gray-800/80 max-w-4xl w-full mx-auto">
              
              {/* Attached image preview pill prior to sending */}
              {attachedImage && (
                <div className="mb-2 inline-flex items-center space-x-2 bg-gemini-800 border border-gray-700 px-3 py-1.5 rounded-xl">
                  <img src={attachedImage.previewUrl} alt="Upload preview" className="w-8 h-8 rounded-lg object-cover" />
                  <span className="text-xs text-gray-300 truncate max-w-xs">Attached Image</span>
                  <button 
                    onClick={() => setAttachedImage(null)}
                    className="p-1 hover:bg-gray-700 rounded-full text-gray-400 hover:text-white"
                  >
                    <i data-lucide="x" className="w-3.5 h-3.5"></i>
                  </button>
                </div>
              )}

              <form 
                onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }}
                className="relative bg-gemini-800/90 border border-gray-700 rounded-2xl shadow-xl focus-within:border-blue-500/80 transition p-2"
              >
                <textarea
                  value={inputMessage}
                  onChange={(e) => setInputMessage(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                      e.preventDefault();
                      handleSendMessage();
                    }
                  }}
                  placeholder={mode === 'image' ? "Describe the image you want Imagen 4 to generate..." : "Ask Gemini anything or request real-time web info..."}
                  className="w-full bg-transparent text-gray-100 placeholder-gray-400 text-sm p-3 focus:outline-none resize-none max-h-32 min-h-[50px] custom-scrollbar"
                />

                <div className="flex items-center justify-between pt-2 px-2 border-t border-gray-700/50">
                  <div className="flex items-center space-x-1">
                    
                    {/* File / Image Attachment Button */}
                    <input 
                      type="file" 
                      ref={fileInputRef} 
                      onChange={handleImageUpload} 
                      accept="image/*" 
                      className="hidden" 
                    />
                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="p-2 text-gray-400 hover:text-white hover:bg-gray-700/60 rounded-xl transition"
                      title="Attach Image for Vision Analysis"
                    >
                      <i data-lucide="paperclip" className="w-4 h-4"></i>
                    </button>

                    {/* Voice Dictation Button */}
                    <button
                      type="button"
                      onClick={toggleVoiceDictation}
                      className={`p-2 rounded-xl transition ${isRecording ? 'text-red-400 bg-red-500/20 animate-pulse' : 'text-gray-400 hover:text-white hover:bg-gray-700/60'}`}
                      title="Speech-to-Text Input"
                    >
                      <i data-lucide="mic" className="w-4 h-4"></i>
                    </button>
                  </div>

                  {/* Send Button */}
                  <button
                    type="submit"
                    disabled={(!inputMessage.trim() && !attachedImage) || isLoading}
                    className="p-2.5 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500 text-white rounded-xl transition shadow-md flex items-center justify-center"
                  >
                    <i data-lucide="send" className="w-4 h-4"></i>
                  </button>
                </div>
              </form>

              <p className="text-[10px] text-center text-gray-500 mt-2">
                Gemini may display inaccurate info. Powered by Google Search Grounding & Gemini 3 Flash.
              </p>
            </div>

          </main>

          {}
          {/* SETTINGS MODAL */}
          {settingsOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gemini-950 border border-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                  <h3 className="text-lg font-bold text-gray-100 flex items-center space-x-2">
                    <i data-lucide="sliders" className="w-5 h-5 text-blue-400"></i>
                    <span>Settings & API Key</span>
                  </h3>
                  <button onClick={() => setSettingsOpen(false)} className="text-gray-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-4 text-xs text-gray-300">
                  <div>
                    <label className="block font-semibold mb-1 text-gray-200">
                      Google AI Studio API Key (Optional Override)
                    </label>
                    <input
                      type="password"
                      value={apiKey}
                      onChange={(e) => handleSaveApiKey(e.target.value)}
                      placeholder="Keyless active inside studio environment"
                      className="w-full p-2.5 rounded-xl bg-gemini-900 border border-gray-700 text-gray-100 focus:outline-none focus:border-blue-500"
                    />
                    <p className="text-[11px] text-gray-400 mt-1">
                      If hosting publicly on GitHub Pages, enter your free key from Google AI Studio. Inside Canvas runtime, keyless mode works automatically!
                    </p>
                  </div>

                  <div className="p-3 bg-blue-900/20 border border-blue-500/30 rounded-xl space-y-1">
                    <p className="font-semibold text-blue-300">⚡ Grounding & Real-time Web Search</p>
                    <p className="text-[11px] text-gray-300">
                      Uses Gemini 3 Flash with Google Search tools to pull factual up-to-date web answers with citation links.
                    </p>
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setSettingsOpen(false)}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs rounded-xl transition"
                  >
                    Done & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* GITHUB PAGES DEPLOYMENT MODAL */}
          {ghPagesModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gemini-950 border border-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                  <h3 className="text-lg font-bold text-purple-300 flex items-center space-x-2">
                    <i data-lucide="github" className="w-5 h-5"></i>
                    <span>Host Free on GitHub Pages</span>
                  </h3>
                  <button onClick={() => setGhPagesModalOpen(false)} className="text-gray-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs text-gray-300">
                  <p>You can host this entire web app on GitHub Pages in 3 simple steps:</p>

                  <ol className="list-decimal list-inside space-y-2 bg-gemini-900 p-3 rounded-xl border border-gray-800 font-mono text-[11px] text-gray-200">
                    <li>Create a new public repository on GitHub (e.g. <span className="text-purple-400">gemini-web-app</span>).</li>
                    <li>Upload this single file as <span className="text-emerald-400">index.html</span> into your repository.</li>
                    <li>Go to Repo <b>Settings &gt; Pages</b>, select <b>main branch</b> and click Save!</li>
                  </ol>

                  <div className="p-3 bg-purple-900/20 border border-purple-500/30 rounded-xl">
                    <p className="font-semibold text-purple-300">🔑 Keyless / User Key Mode</p>
                    <p className="text-[11px] text-gray-300 mt-0.5">
                      When deployed on GitHub Pages, users can enter their own free Google AI Studio API key in the Settings modal, keeping your host account safe.
                    </p>
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setGhPagesModalOpen(false)}
                    className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-medium text-xs rounded-xl transition"
                  >
                    Got It!
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
